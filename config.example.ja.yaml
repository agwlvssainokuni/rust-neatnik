# neatnik サンプル設定ファイル
#
# `neatnik init` の出力もこのファイルと同じ内容です。
# 詳細な各項目の意味は README.md を参照してください。
#
# 編集後は次の順で確認することを推奨します:
#   1. neatnik validate --config <このファイル>
#   2. neatnik run --config <このファイル> --dry-run
#   3. neatnik run --config <このファイル>
#
# jobs には複数のジョブを列挙できます(下に "- name: ..." を追加)。
# 各ジョブはロックスコープ(同時に1実行のみ)としてstagesをまとめます。

jobs:
  - name: app-server-logs

    # stagesは、archive/relocate/deleteエントリを並べた順序付きリストです。
    # 各ステージ種別は0回以上(複数可)・任意の順序で書けますが、書かれた順序どおりに
    # 実行されます。各エントリは自身の"targets"を個別に監視するため、後続のステージは
    # 自身のtargets/includeパターンにマッチしたファイルしか見つけられません
    # (例: relocateはarchiveの既知の出力パターンを、deleteはrelocateのdestinationを
    # それぞれ監視対象にするとよいでしょう)。
    stages:
      # アーカイブ(圧縮)段階
      - type: archive
        # 必須。バンドルアーカイブの命名に使う(<name>.<ターゲット名>.<期間キー>.tar.gz)
        name: app-server-logs-archive
        targets:
          - basedir: "/var/log/app"
            include:
              - "**/*.log"
            exclude:
              - "current.log"
            # 基準日時の情報源: mtime(既定) | filename_date
            basis: mtime
            # basis: filename_date の場合のみ使用。上から順に照合し最初にマッチしたものを採用する
            # filename_date_rules:
            #   - regex: "^app_log\\.(?P<date>\\d{4}-\\d{2}-\\d{2})\\.txt$"
            #     format: "%Y-%m-%d"
        after_days: 7
        # gzip | zip | tar.gz
        format: gzip
        # none(単体ファイル圧縮) | daily | weekly | monthly(バンドル圧縮)
        bundle: none
        # bundle_timezone: "Asia/Tokyo"  # 省略時はローカルタイムゾーン
        keep_original: false
        # bundleがdaily/weekly/monthlyの場合のみ使用: warn | error
        on_stale_bundle_member: warn

      # 退避(保管フォルダへの移動)段階。上のarchiveの出力(*.gz)を監視対象にする
      - type: relocate
        targets:
          - basedir: "/var/log/app"
            include:
              - "**/*.gz"
        after_days: 30
        destination: "/mnt/storage/app-logs"
        # preserve(basedir相対パスを保持) | year_month(YYYY/MM分類)
        layout: preserve
        # rename(連番付与) | skip | error
        on_conflict: rename

      # 削除段階。上のrelocateのdestinationを監視対象にする
      - type: delete
        targets:
          - basedir: "/mnt/storage/app-logs"
            include:
              - "**/*"
        after_days: 365
        safety_brake:
          enforce: true
          count_threshold: 1000
          size_threshold_gb: 50

  - name: worker-batch-logs

    # 2つ目のジョブの例: バンドル圧縮(bundle: daily)。単体ファイル圧縮(上のジョブ)との
    # 違いはarchiveステージの"bundle"設定のみ。基準日時が同じ期間(ここでは日次)に
    # 属する複数ファイルをまとめて1つの<name>.<ターゲット名>.<期間キー>.tar.gzに圧縮する
    # (バンドル圧縮の出力は常にtar.gz固定であり、formatは単体ファイル圧縮(bundle: none)
    # にのみ適用される)
    stages:
      - type: archive
        name: worker-batch-logs-archive
        targets:
          - basedir: "/var/log/worker-batch"
            # バンドル命名(<name>.<ターゲット名>.<期間キー>.tar.gz)に使うターゲット名。
            # 省略時はbasedirから自動生成される
            name: worker-batch
            include:
              - "*.log"
        after_days: 7
        # daily(日次) | weekly(週次) | monthly(月次)
        bundle: daily
        # bundle_timezone: "Asia/Tokyo"  # 省略時はローカルタイムゾーン
        keep_original: false
        # 同じ期間の既存バンドルより基準日時が新しいファイルが見つかった場合の挙動:
        # warn(既定) | error
        on_stale_bundle_member: warn

      # 退避(保管フォルダへの移動)段階。上のarchiveの出力(*.tar.gz)を監視対象にする
      - type: relocate
        targets:
          - basedir: "/var/log/worker-batch"
            include:
              - "*.tar.gz"
        after_days: 30
        destination: "/mnt/storage/worker-batch-logs"
        layout: preserve
        on_conflict: rename

      # 削除段階。上のrelocateのdestinationを監視対象にする
      - type: delete
        targets:
          - basedir: "/mnt/storage/worker-batch-logs"
            include:
              - "**/*"
        after_days: 365
